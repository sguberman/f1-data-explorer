<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 F1 Constructors' Championship — Top Four Teams</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 16px 40px;}
.wrap{max-width:820px;margin:0 auto;}
h1{font-size:18px;margin:0 0 4px;color:var(--ink);}
.sub{font-size:12.5px;color:var(--sub);margin:0 0 16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;}
</style>
</head>
<body>
<div class="wrap">
<div class="theme-bar" id="themeToggle"></div>
<h1>2026 F1 Constructors' Championship — Top Four Teams</h1>
<p class="sub">Mercedes, Ferrari, McLaren, Red Bull · through Round 15 (Azerbaijan) · projections from each team's last 5 rounds</p>
<div class="card">
<div id="lg" style="display:flex;flex-wrap:wrap;gap:6px 16px;margin:0 0 10px;font-size:12px;color:var(--ink2);"></div>
<div style="position:relative;width:100%;height:440px;"><canvas id="c"></canvas></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ff=getComputedStyle(document.body).fontFamily;
Chart.defaults.font.family=ff;Chart.defaults.font.size=11;
const N=23,L=15;
const R=['Australia','China','Japan','Miami','Canada','Monaco','Barcelona','Austria','Britain','Belgium','Hungary','Netherlands','Italy','Spain','Azerbaijan','Bahrain (Sepang)','Singapore','USA','Mexico','Brazil','Las Vegas','Qatar','Abu Dhabi'];
const D=[
{n:'Mercedes',c:'#00A79D',w:[43,55,37,45,39,25,18,40,31,25,21,46,43,35,35]},
{n:'Ferrari',c:'#DC0000',w:[27,40,23,20,37,18,25,14,51,30,22,31,8,12,20]},
{n:'McLaren',c:'#FF8000',w:[10,8,28,48,12,12,25,18,20,16,25,43,22,19,0]},
{n:'Red Bull',c:'#1B2A6B',w:[8,4,4,14,27,15,20,26,13,23,26,9,15,26,33]}
];
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
D.forEach(d=>{
 let s=0;d.cum=d.w.map(v=>s+=v);
 d.rate=d.w.slice(10,15).reduce((x,y)=>x+y,0)/5;
 d.last=d.cum[L-1];
 d.proj=Array.from({length:N},(_,i)=>i>=L-1?d.last+d.rate*(i-(L-1)):null);
 d.fin=d.proj[N-1];
});
let P,chart;
function draw(){
P=F1Theme.chart();Chart.defaults.color=P.text;
const DC=D.map(d=>({...d,c:F1Theme.team(d.c)}));
const ds=[];
DC.forEach(d=>ds.push({team:d.n,data:d.cum.concat(Array(N-L).fill(null)),borderColor:d.c,borderWidth:2.5,tension:0,pointRadius:x=>x.dataIndex===L-1?4:0,pointHoverRadius:4,pointBackgroundColor:d.c,pointBorderColor:P.pointRing,pointBorderWidth:2}));
DC.forEach(d=>ds.push({team:d.n,kind:'p',c:d.c,fin:d.fin,data:d.proj,borderColor:rgba(d.c,.5),borderWidth:2,tension:0,pointRadius:0,pointHoverRadius:3,pointBackgroundColor:d.c}));
const shade={id:'shade',beforeDatasetsDraw(ch){
 const {ctx,chartArea:a,scales:{x}}=ch;const x0=x.getPixelForValue(L-1);
 ctx.save();ctx.fillStyle=P.projShade;ctx.fillRect(x0,a.top,a.right-x0,a.bottom-a.top);
 ctx.strokeStyle=P.divider;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(x0,a.top);ctx.lineTo(x0,a.bottom);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle=P.dividerText;ctx.font='11px '+ff;ctx.textAlign='right';ctx.fillText('Actual',x0-8,a.top+13);ctx.textAlign='left';ctx.fillText('Projected',x0+8,a.top+13);ctx.restore();}};
const ends={id:'ends',afterDatasetsDraw(ch){
 const it=[];ch.data.datasets.forEach((s,i)=>{if(s.kind!=='p')return;const p=ch.getDatasetMeta(i).data[N-1];it.push({x:p.x,y:p.y,ly:p.y,s});});
 it.sort((a,b)=>a.y-b.y);for(let i=1;i<it.length;i++)if(it[i].ly-it[i-1].ly<13)it[i].ly=it[i-1].ly+13;
 const {ctx}=ch;ctx.save();ctx.font='11px '+ff;ctx.textAlign='left';ctx.textBaseline='middle';
 it.forEach(o=>{ctx.fillStyle=o.s.c;ctx.fillRect(o.x+7,o.ly-3,6,6);ctx.fillStyle=P.label;ctx.fillText(o.s.team+' '+Math.round(o.s.fin),o.x+17,o.ly);});ctx.restore();}};
// Reserve right padding from the widest end label so it's never clipped
const mc=document.createElement('canvas').getContext('2d');mc.font='11px '+ff;
const PR=Math.ceil(Math.max(...ds.filter(s=>s.kind==='p').map(s=>mc.measureText(s.team+' '+Math.round(s.fin)).width)))+17+8;
if(chart)chart.destroy();
chart=new Chart(document.getElementById('c'),{type:'line',data:{labels:R.map((_,i)=>String(i+1)),datasets:ds},plugins:[shade,ends],
options:{responsive:true,maintainAspectRatio:false,layout:{padding:{right:PR,top:4}},interaction:{mode:'index',intersect:false},
plugins:{legend:{display:false},tooltip:{filter:i=>i.raw!=null&&(i.dataset.kind==='p'?i.dataIndex>L-1:true),itemSort:(a,b)=>b.raw-a.raw,
callbacks:{title:t=>{const i=t[0].dataIndex;return 'Round '+(i+1)+' · '+R[i]+(i>L-1?' (projected)':'');},label:t=>' '+t.dataset.team+': '+Math.round(t.raw)}}},
scales:{x:{offset:false,grid:{display:false},border:{color:P.axis},title:{display:true,text:'Round',color:P.text}},
y:{min:0,max:900,ticks:{stepSize:100},grid:{color:P.grid},border:{display:false},title:{display:true,text:'Cumulative championship points',color:P.text}}}}});
const sw=c=>`<svg width="20" height="8"><line x1="1" y1="4" x2="19" y2="4" stroke="${c}" stroke-width="2.5"/></svg>`;
document.getElementById('lg').innerHTML=DC.map(d=>`<span style="display:flex;align-items:center;gap:6px;">${sw(d.c)}${d.n}</span>`).join('');
}
draw();
window.addEventListener('themechange',draw);
</script>
</body>
</html>
