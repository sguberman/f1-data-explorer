<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Finishing Positions · F1 Data Explorer</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="nav.js"></script>
<script src="common.js"></script>
<script src="data.js"></script>
<script src="share.js"></script>
<script src="export.js"></script>
<script src="controls.js"></script>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 16px 40px;}
.wrap{max-width:820px;margin:0 auto;}
h1{font-size:18px;margin:0 0 4px;color:var(--ink);}
.sub{font-size:12.5px;color:var(--sub);margin:0 0 16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
.note{font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:10px;}
.ridgeWrap{position:relative;width:100%;}
/* #87: results heat strip — a row per driver, a square per round, stronger colour = better Grand Prix finish */
.hsBox{position:relative;}
.hsGrid{display:grid;grid-template-columns:max-content repeat(var(--hs-n,1),minmax(0,22px));gap:2px;align-items:center;justify-content:start;}
.hsCorner{min-height:12px;}
.hsRound{font-size:9.5px;line-height:12px;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:visible;display:flex;justify-content:center;}
.hsRound.later{opacity:.45;}
.hsLabel{font-size:12px;font-weight:600;white-space:nowrap;padding-right:6px;display:flex;align-items:center;}
.hsLabel .flag{margin-right:4px;}
.hsCell{aspect-ratio:1;border-radius:3px;position:relative;cursor:default;}
.hsCell.pod::after{content:"";position:absolute;left:50%;top:50%;width:28%;height:28%;transform:translate(-50%,-50%);border-radius:50%;background:var(--panel);}
.hsCell.nc{background:linear-gradient(45deg,transparent 43.5%,var(--elim) 43.5% 56.5%,transparent 56.5%),linear-gradient(-45deg,transparent 43.5%,var(--elim) 43.5% 56.5%,transparent 56.5%),var(--inset);}
.hsCell.none::after{content:"";position:absolute;left:30%;right:30%;top:50%;height:1.5px;margin-top:-.75px;background:var(--line-strong);border-radius:1px;}
.hsCell.sel{outline:2px solid var(--ink);outline-offset:1px;z-index:1;}
.hsKey{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:11.5px;color:var(--sub);margin-top:10px;}
.hsKeyItem{display:inline-flex;align-items:center;gap:4px;}
.hsKeyRamp{display:inline-flex;gap:2px;}
.hsKey .hsCell{width:11px;height:11px;flex:none;}
.hsTip{position:absolute;z-index:10;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;
  box-shadow:0 4px 14px var(--shadow);padding:6px 9px;font-size:12px;line-height:1.45;white-space:nowrap;}
.hsTip[hidden]{display:none;}
.hsTip b{font-weight:600;}
.hsTip .hsTipSub{color:var(--sub);}
@media (max-width:600px){
  .hsGrid{gap:1px;}
  .hsRound{font-size:8px;letter-spacing:-.3px;}
  .hsLabel{font-size:11px;padding-right:4px;}
  .hsCell{border-radius:2px;}
}
</style>
</head>
<body>
<div class="wrap">
<div class="theme-bar"><nav id="siteNav" class="site-nav" aria-label="Site"></nav><div id="themeToggle"></div></div>
<h1>Race Finishing Positions</h1>
<p class="sub" id="pageSub">How often each selected driver has finished in each position.</p>
<div id="f1controls" class="f1c"></div>
<div class="card" style="margin-bottom:16px;">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;">
 <span style="font-size:12px;color:var(--sub);">Sort by</span>
 <select id="chartSortSelect" class="ddSelect" aria-label="Sort by">
  <option value="mode">Most common</option>
  <option value="champ">Championship</option>
  <option value="team">Team</option>
 </select>
</div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;">
 <span style="font-size:12px;color:var(--sub);flex:0 0 100%;">Show</span>
 <div class="optCheckRow" id="chartOptRow">
  <label class="optCheck"><input type="checkbox" data-opt="below10"> Below P10</label>
  <label class="optCheck"><input type="checkbox" data-opt="sprint" checked> Sprints</label>
 </div>
</div>
<div class="ridgeWrap f1-skel" id="ridgeWrap"><canvas id="ridgeCanvas"></canvas></div>
<div id="empty" style="font-size:12.5px;color:var(--sub);display:none;">No drivers selected.</div>
<div class="ridgeKey" id="ridgeKey"></div>
<div class="note" id="ridgeNote"></div>
</div>
<div class="card" id="heatCard" style="margin-bottom:16px;">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:0 0 10px;">
 <span style="font-size:13px;font-weight:600;color:var(--ink);">Results by round</span>
 <span style="font-size:12px;color:var(--sub);">same drivers as above · Grand Prix finishes</span>
</div>
<div class="hsBox f1-skel" id="heatBox">
 <div class="hsGrid" id="heatStrip" role="img" aria-label="Heat strip of each selected driver's Grand Prix finish in every round: the stronger the colour, the better the finish."></div>
 <div class="hsTip" id="heatTip" hidden></div>
</div>
<div id="heatEmpty" style="font-size:12.5px;color:var(--sub);display:none;">No drivers selected.</div>
<div class="hsKey" id="heatKey"></div>
<div class="note" id="heatNote"></div>
</div>
<div class="card">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;">
 <span style="font-size:12px;color:var(--sub);">Drivers shown</span>
 <span style="flex:1;"></span>
 <span style="font-size:12px;color:var(--sub);">Sort by</span>
 <select id="sortSeg" class="ddSelect" aria-label="Sort drivers shown">
  <option value="team">Team</option>
  <option value="rank">Ranking</option>
 </select>
</div>
<div class="btnrow" id="presetRow" style="margin-bottom:10px;">
 <button type="button" class="pill" data-preset="all">All</button>
 <button type="button" class="pill" data-preset="none">None</button>
 <button type="button" class="pill" data-preset="5">Top 5</button>
 <button type="button" class="pill" data-preset="10">Top 10</button>
</div>
<div id="driverPicker" class="f1-skel"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ff=getComputedStyle(document.body).fontFamily;

let LAB=['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','11+/NC'];

let D=[], L=0, P, FULL=[];
// issue #35: chart display options — all computed purely from already-loaded season data, no network.
// chartSort: 'mode' (default, best most-common finish on top, #30), 'champ' (current drivers' standings order),
// 'team' (teams grouped by constructors' standings order, drivers within a team by standings order).
// showBelowP10: false (default) folds everything below P10 into one "11+/NC" bucket, same as before;
// true expands individual positions down to the worst classified finish seen, plus a separate NC bucket.
// #46: a result with a classified position counts as that position, even if the driver retired; NC ("not
// classified") is every result with no finishing position.
// includeSprints: true (default, new as of #35) folds sprint-session results into the same histogram as
// Grand Prix results; false restricts the chart to Grand Prix classification only, as it was before.
let chartSort='mode', showBelowP10=false, includeSprints=true;

// issue #33: single ridgeline (joyplot) chart for the selected drivers — same mechanism as the
// simulator's ridgeline plots (#32): each driver gets a baseline row (invisible flat dataset) and a
// stepped curve dataset filled down to it with fill:'-1', offset vertically so rows stack, normalized
// to each driver's OWN peak bucket (a shape comparison, not an absolute-count one).
const RIDGE_ROW=1, RIDGE_PEAK=0.82, RIDGE_ROW_PX=58, RIDGE_PAD_PX=34, RIDGE_FILL_ALPHA=0.35;
let ridgeChart=null;
// #30: a driver's most common finish(es), always over individual positions plus NC (P1…Pworst, NC) —
// even when the chart groups everything below P10 into one "11+/NC" bucket, which must not win just for
// being a group. Returns indexes into fullLabels(), every one if tied; [] with no starts.
function fullLabels(){
 const labs=[]; for(let p=1, max=maxClassifiedPosition(); p<=max; p++) labs.push('P'+p);
 labs.push('NC');
 return labs;
}
function modesOf(counts){
 const top=Math.max(0,...counts);
 return top>0 ? counts.map((v,j)=>v===top?j:-1).filter(j=>j>=0) : [];
}
let currentYear=null, currentSeasonRounds=[], selectedDriverIds=null, pickerSort='team';

async function buildFromSelection(detail){
 currentYear = detail.year;
 currentSeasonRounds = detail.seasonRounds;
 if(!currentSeasonRounds.length){ D=[]; draw(); renderDriverPicker(); return; }
 selectedDriverIds = null; // reset default whenever the season changes; round changes never touch this
 L = detail.round;
 defaultIds = selectedDriverIds = F1Common.standingsOrder(currentSeasonRounds, L, 'drivers').slice(0,8); // top 8 — roughly "top four teams" from the old static page
 const link = F1Share.take(); // #31: a shared link's setup, first season only
 if(link){
   const linked = F1Share.ids(link.get('d'), Object.keys(F1Data.cumulative(currentSeasonRounds, currentSeasonRounds.length).drivers));
   if(linked) selectedDriverIds = linked;
   const sel = document.getElementById('chartSortSelect');
   if([...sel.options].some(o=>o.value===link.get('chart'))) sel.value = chartSort = link.get('chart');
   if(['team','rank'].includes(link.get('sort'))) document.getElementById('sortSeg').value = pickerSort = link.get('sort');
   const opt = (name, on)=>{ const cb=document.querySelector(`#chartOptRow input[data-opt="${name}"]`); cb.checked=on; return on; };
   if(link.get('below10')!=null) showBelowP10 = opt('below10', link.get('below10')==='1');
   if(link.get('sprint')!=null) includeSprints = opt('sprint', link.get('sprint')==='1');
 }
 recompute(detail.round);
 if(link) F1Share.sync(); // #31: the URL reflects the link once it's applied
}
// #31: what goes in the URL (anything at its default is left out)
let defaultIds=[];
F1Share.register(()=>({
 d: F1Share.sameSet(selectedDriverIds, defaultIds) ? null : (selectedDriverIds||[]).join(','),
 chart: chartSort==='mode' ? null : chartSort,
 sort: pickerSort==='team' ? null : pickerSort,
 below10: showBelowP10 ? '1' : null,
 sprint: includeSprints ? null : '0',
}));

// Sessions (race, plus sprint if included) contributing to the histogram for a round, respecting the
// current includeSprints toggle.
function sessionRowsFor(r){
 return includeSprints && r.sprintResults ? [...(r.raceResults||[]), ...r.sprintResults] : (r.raceResults||[]);
}

// Worst classified position seen across all loaded rounds (through L), respecting the current
// sprint toggle — used to size the expanded "show positions below P10" bucket range.
function maxClassifiedPosition(){
 let max = 10;
 currentSeasonRounds.forEach(r=>{
   if(r.round > L) return;
   sessionRowsFor(r).forEach(res=>{
     if(res.position!=null && res.position>max) max = res.position;
   });
 });
 return max;
}

function buildLabels(){
 if(!showBelowP10) return ['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','11+/NC'];
 const max = maxClassifiedPosition();
 const labs = []; for(let p=1; p<=max; p++) labs.push('P'+p);
 labs.push('NC');
 return labs;
}

// Finishing-position histogram for one driver through round L, honoring the current sprint/
// below-P10 toggles — pure in-memory aggregation over already-loaded data, safe on every drag/slider step.
function bucketsFor(driverId, labels){
 const n = labels.length, ncIdx = n-1;
 const v = Array(n).fill(0);
 let starts = 0;
 currentSeasonRounds.forEach(r=>{
   if(r.round > L) return;
   sessionRowsFor(r).forEach(res=>{
     if(res.driverId !== driverId) return;
     starts++;
     const pos = res.position;
     const idx = (pos!=null && pos>=1 && pos<=ncIdx) ? pos-1 : ncIdx;
     v[idx]++;
   });
 });
 return { v, starts };
}

// Pure recompute from already-loaded season data — no network, safe to call on every slider step or
// option toggle.
function recompute(round){
 L = round;
 const cum = F1Data.cumulative(currentSeasonRounds, L);
 const driverRanked = F1Common.standingsOrder(currentSeasonRounds, L, 'drivers');
 const driverRank = {}; driverRanked.forEach((id,i)=>{ driverRank[id]=i; });
 const teamRanked = F1Common.standingsOrder(currentSeasonRounds, L, 'teams');
 const teamRank = {}; teamRanked.forEach((id,i)=>{ teamRank[id]=i; });
 LAB = buildLabels(); FULL = fullLabels();
 D = (selectedDriverIds||[]).map(id=>{
   const dr = cum.drivers[id]; if(!dr) return null;
   const {v,starts} = bucketsFor(id, LAB);
   const modes = modesOf(bucketsFor(id, FULL).v); // #30: over individual positions, see modesOf
   return { id, modes, n:dr.code, teamId:dr.teamId, teamName:dr.teamName, c:F1Common.teamColor(dr.teamId), v, starts,
     driverRank:driverRank[id]??999, teamRank:teamRank[dr.teamId]??999 };
 }).filter(Boolean);
 draw();
 renderDriverPicker();
}

// The selected drivers in the "Sort by" order, shared by the ridgeline chart and the heat strip (#87).
function sortedRows(){
 return [...D].sort((a,b)=>{
   if(chartSort==='champ') return a.driverRank-b.driverRank;
   if(chartSort==='team') return (a.teamRank-b.teamRank) || (a.driverRank-b.driverRank);
   // 'mode' (default): best most-common finish first (NC counts as the worst); ties by standings
   const best=d=>d.modes.length ? d.modes[0] : Infinity;
   return (best(a)-best(b)) || (a.driverRank-b.driverRank);
 });
}

function draw(){
 drawHeat();
 const wrap=document.getElementById('ridgeWrap'), empty=document.getElementById('empty'), note=document.getElementById('ridgeNote');
 if(ridgeChart){ ridgeChart.destroy(); ridgeChart=null; }
 if(!D.length){ wrap.style.display='none'; empty.style.display='block'; note.textContent=''; document.getElementById('ridgeKey').innerHTML=''; updateSub(); return; }
 wrap.style.display='block'; empty.style.display='none';
 P=F1Theme.chart();
 Chart.defaults.font.family=ff; Chart.defaults.color=P.text;
 const order=sortedRows().map(d=>({id:d.id, code:d.n, color:F1Theme.team(d.c), counts:d.v, starts:d.starts, modes:d.modes,
     driverRank:d.driverRank, teamRank:d.teamRank}));
 const n=order.length;
 wrap.style.height=(n*RIDGE_ROW_PX+RIDGE_PAD_PX)+'px';
 const datasets=[];
 order.forEach(({code,color,counts,starts,modes},i)=>{
   const baseline=(n-1-i)*RIDGE_ROW;
   const peak=Math.max(...counts,1e-9);
   const heights=counts.map(v=>baseline+(v/peak)*RIDGE_PEAK);
   datasets.push({ data:LAB.map(()=>baseline), borderWidth:0, pointRadius:0, fill:false, _baseline:true });
   // #30: most common position(s), every tied one, drawn by F1Common.ridgeMarkers. One below P10 while
   // those positions are grouped goes on the "11+/NC" bucket, labelled with the real position(s).
   const shown=[], labels={};
   modes.forEach(m=>{
     const j = showBelowP10 || m<10 ? m : LAB.length-1;
     if(!shown.includes(j)) shown.push(j);
     if(!showBelowP10 && m>=10) labels[j] = labels[j] ? labels[j]+'/'+FULL[m] : FULL[m];
   });
   datasets.push({ data:heights, borderColor:color, backgroundColor:F1Common.withAlpha(color,RIDGE_FILL_ALPHA), borderWidth:1.6, pointRadius:0,
     fill:'-1', stepped:'middle', _code:code, _counts:counts, _starts:starts, _modes:shown, _modeLabels:labels });
 });
 ridgeChart=new Chart(document.getElementById('ridgeCanvas'),{
   type:'line',
   plugins:[F1Common.ridgeMarkers(), F1Common.ridgeFlags(row=>order[n-1-row] && order[n-1-row].id)],
   data:{labels:LAB, datasets},
   options:{
     responsive:true, maintainAspectRatio:false, animation:false,
     interaction:{mode:'index', intersect:false},
     plugins:{
       legend:{display:false},
       tooltip:{
         filter:item=>!item.dataset._baseline,
         callbacks:{
           title:t=>t[0].label,
           label:ctx=>{
             const cnt=ctx.dataset._counts[ctx.dataIndex], starts=ctx.dataset._starts;
             const pct=starts?100*cnt/starts:0;
             return ` ${ctx.dataset._code}: ${cnt} start${cnt===1?'':'s'} (${pct.toFixed(0)}%)`;
           }
         }
       }
     },
     scales:{
       // issue #13 (mobile): narrow screens rotate the bucket labels (P1...P10, 11+/NC), which don't fit
     // horizontally since autoSkip is deliberately off for the default <=12-bucket case.
     x:{grid:{color:P.grid}, ticks:{color:P.text, maxRotation:F1Common.isNarrow()?60:0, minRotation:F1Common.isNarrow()?60:0,
         autoSkip:LAB.length>12, font:{size:F1Common.isNarrow()?9:11}}},
       y:{
         min:-0.15, max:(n-1)*RIDGE_ROW+RIDGE_PEAK+0.25,
         grid:{display:false},
         afterFit:s=>{ s.width+=F1Common.FLAG_ROOM; }, // room for the flags (#18)
         afterBuildTicks:axis=>{ axis.ticks=Array.from({length:n},(_,i)=>({value:i})); },
         ticks:{
           color:ctx=>{ const i=n-1-Math.round(ctx.tick.value); return (order[i]&&order[i].color)||P.text; },
           callback:value=>{ const i=n-1-Math.round(value); return (order[i]&&order[i].code)||''; },
           font:{weight:'600'}
         }
       }
     }
   }
 });
 document.getElementById('ridgeKey').innerHTML = F1Common.ridgeKeyHTML('most common finish');
 note.textContent = 'NC = not classified (no finishing position). Races counted: ' + order.map(o=>`${o.code} ${o.starts}`).join(' · ');
 updateSub();
}

// #87: results heat strip. One row per selected driver (same order as the chart), one square per loaded round:
// the Grand Prix finish, P1 strongest and P20 and below faintest, on a single-hue ramp per theme. NC (no
// classified position) is a cross in the elim colour, a round the driver didn't race a short dash, and rounds
// after the slider's round are left blank. Hover or tap a square for the race and finish (plus the sprint
// finish while "Sprints" is shown). Built from already-loaded data; never fetches.
const HEAT_RAMP={ light:{hi:'#173a80', lo:'#e3e9f3'}, dark:{hi:'#9dc1ff', lo:'#252e3d'} }, HEAT_WORST=20;
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
// Mixed in OKLab so the steps look even.
function toOklab([r,g,b]){
 const lin=c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4); [r,g,b]=[r,g,b].map(lin);
 const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b), m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b), s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
 return [0.2104542553*l+0.7936177850*m-0.0040720468*s, 1.9779984951*l-2.4285922050*m+0.4505937099*s, 0.0259040371*l+0.7827717662*m-0.8086757660*s];
}
function fromOklab([L,A,B]){
 const l=(L+0.3963377774*A+0.2158037573*B)**3, m=(L-0.1055613458*A-0.0638541728*B)**3, s=(L-0.0894841775*A-1.2914855480*B)**3;
 const g=c=>{ c=c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055; return Math.round(255*Math.min(1,Math.max(0,c))); };
 return `rgb(${g(4.0767416621*l-3.3077115913*m+0.2309699292*s)}, ${g(-1.2684380046*l+2.6097574011*m-0.3413193965*s)}, ${g(-0.0041960863*l-0.7034186147*m+1.7076147010*s)})`;
}
function heatColor(pos){
 const r=HEAT_RAMP[F1Theme.current()]||HEAT_RAMP.light, a=toOklab(hexRGB(r.hi)), b=toOklab(hexRGB(r.lo));
 const t=(Math.min(Math.max(pos,1),HEAT_WORST)-1)/(HEAT_WORST-1);
 return fromOklab(a.map((v,i)=>v+(b[i]-v)*t));
}
// A driver's finish in one session: a position, 'NC', or null when they weren't in it.
function finishIn(rows, id){
 const x=(rows||[]).find(res=>res.driverId===id);
 return x ? (x.position!=null ? x.position : 'NC') : null;
}
const finishText=v=>v==null ? 'did not race' : v==='NC' ? 'NC (not classified)' : 'P'+v;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
let heatRows=[];
// The strip's data: rows in the chart's order, each with a cell per loaded round (rounds after L: later).
// gp: position, 'NC' or null (didn't race); sp: the same for the sprint, undefined when there was none.
function heatData(){
 return sortedRows().map(d=>({ id:d.id, code:d.n, color:F1Theme.team(d.c), nat:F1Common.nationalityOf('drivers', d.id),
   cells:currentSeasonRounds.map(r=>({ round:r.round, race:r.raceName, later:r.round>L,
     gp:r.round>L ? null : finishIn(r.raceResults, d.id),
     sp:r.round>L || !r.sprintResults ? undefined : finishIn(r.sprintResults, d.id) })) }));
}
function heatCellClass(c){
 return c.later ? 'hsCell later' : c.gp==null ? 'hsCell none' : c.gp==='NC' ? 'hsCell nc' : 'hsCell'+(c.gp<=3?' pod':'');
}
function drawHeat(){
 hideHeatTip();
 const grid=document.getElementById('heatStrip'), box=document.getElementById('heatBox');
 heatRows=heatData();
 const none=!heatRows.length;
 box.style.display=none?'none':''; document.getElementById('heatEmpty').style.display=none?'block':'none';
 document.getElementById('heatKey').style.display=none?'none':'';
 document.getElementById('heatNote').textContent=none?'':`The stronger the colour, the better the Grand Prix finish (P${HEAT_WORST} and below faintest). `
   +`NC = not classified. ${L<currentSeasonRounds.length?`Rounds after Round ${L} are left blank. `:''}`
   +(includeSprints?'Hover or tap a square for the race, with the sprint finish on sprint weekends.':'Hover or tap a square for the race; turn on Sprints above to add sprint finishes.');
 if(none){ grid.innerHTML=''; return; }
 grid.style.setProperty('--hs-n', currentSeasonRounds.length);
 grid.innerHTML='<span class="hsCorner"></span>'
   +currentSeasonRounds.map(r=>`<span class="hsRound${r.round>L?' later':''}">${r.round}</span>`).join('')
   +heatRows.map((row,ri)=>`<span class="hsLabel" style="color:${row.color}">${F1Common.flagHTML(row.nat)}${esc(row.code)}</span>`
     +row.cells.map((c,ci)=>`<span class="${heatCellClass(c)}" data-row="${ri}" data-col="${ci}" data-id="${row.id}" data-round="${c.round}" data-v="${c.later?'later':c.gp==null?'':c.gp}"`
       +(typeof c.gp==='number'?` style="background:${heatColor(c.gp)}"`:'')+'></span>').join('')).join('');
 const sw=pos=>`<span class="hsCell${pos<=3?' pod':''}" style="background:${heatColor(pos)}"></span>`;
 document.getElementById('heatKey').innerHTML=
   `<span class="hsKeyItem">P1 <span class="hsKeyRamp">${[1,2,3,5,8,11,14,17,20].map(sw).join('')}</span> P${HEAT_WORST}+</span>`
   +`<span class="hsKeyItem"><span class="hsCell pod" style="background:${heatColor(1)}"></span>podium</span>`
   +`<span class="hsKeyItem"><span class="hsCell nc"></span>NC</span>`
   +`<span class="hsKeyItem"><span class="hsCell none" style="box-shadow:inset 0 0 0 1px var(--line)"></span>did not race</span>`;
}
let heatTipCell=null;
function hideHeatTip(){
 const tip=document.getElementById('heatTip'); if(tip) tip.hidden=true;
 if(heatTipCell){ heatTipCell.classList.remove('sel'); heatTipCell=null; }
}
function showHeatTip(cell){
 const row=heatRows[+cell.dataset.row], c=row && row.cells[+cell.dataset.col]; if(!c) return;
 if(heatTipCell) heatTipCell.classList.remove('sel');
 heatTipCell=cell; cell.classList.add('sel');
 const tip=document.getElementById('heatTip'), box=document.getElementById('heatBox');
 const both=c.sp!==undefined && includeSprints;
 let html=`<b>${esc(row.code)}</b> · Round ${c.round}<div class="hsTipSub">${esc(c.race||'')}</div>`;
 if(c.later) html+=`<div class="hsTipSub">After Round ${L}: move the slider to include it</div>`;
 else{
   html+=`<div>${both ? 'Grand Prix: ' : ''}${finishText(c.gp)}</div>`;
   if(both) html+=`<div>Sprint: ${finishText(c.sp)}</div>`;
 }
 tip.innerHTML=html; tip.hidden=false;
 const b=box.getBoundingClientRect(), r=cell.getBoundingClientRect();
 const w=tip.offsetWidth, h=tip.offsetHeight;
 let left=r.left-b.left+r.width/2-w/2; left=Math.max(0, Math.min(left, b.width-w));
 // above the square (it may cover the card's heading), below it when there's no room inside the card
 const room=r.top-document.getElementById('heatCard').getBoundingClientRect().top;
 let top=r.top-b.top-h-6; if(room<h+10) top=r.bottom-b.top+6;
 tip.style.left=left+'px'; tip.style.top=top+'px';
}
(()=>{
 const grid=document.getElementById('heatStrip');
 grid.addEventListener('pointerover', e=>{ if(e.pointerType!=='mouse') return; const c=e.target.closest('.hsCell'); if(c) showHeatTip(c); });
 grid.addEventListener('pointerleave', e=>{ if(e.pointerType==='mouse') hideHeatTip(); });
 // tap (or click) a square to show its details; tapping it again, elsewhere, or Escape closes them
 grid.addEventListener('pointerdown', e=>{ grid._tapWasOpen = e.pointerType!=='mouse' && e.target.closest('.hsCell')===heatTipCell; });
 grid.addEventListener('click', e=>{ const c=e.target.closest('.hsCell');
   if(!c) return hideHeatTip();
   if(grid._tapWasOpen){ grid._tapWasOpen=false; return hideHeatTip(); }
   showHeatTip(c); });
 document.addEventListener('click', e=>{ if(heatTipCell && !grid.contains(e.target)) hideHeatTip(); });
 document.addEventListener('keydown', e=>{ if(e.key==='Escape') hideHeatTip(); });
})();

// issue #16: the page introduction, reflecting the round and the Show options (the race name is in the
// round label right below, so it isn't repeated here).
function updateSub(){
 const opts = [
   includeSprints ? 'Grand Prix and sprint results' : 'Grand Prix results only',
   showBelowP10 ? 'full finishing order shown' : 'positions below P10 grouped'
 ];
 document.getElementById('pageSub').textContent =
   `How often each selected driver has finished in each position, through Round ${L}. `
   + opts.join('; ').replace(/^./, c=>c.toUpperCase()) + '.';
}

function pickerRowHTML(d, rank, moves){
 return F1Common.driverPickerRowHTML(d, {rank, checked:selectedDriverIds.includes(d.driverId), points:d.total, move:moves[d.driverId]});
}

function renderDriverPicker(){
 if(!currentSeasonRounds.length) return;
 const cum = F1Data.cumulative(currentSeasonRounds, L);
 let roster = Object.values(cum.drivers).map(d=>({...d,total:d.rounds.reduce((s,x)=>s+x.points,0)}));
 const rank = F1Common.standingsRank(currentSeasonRounds, L, 'drivers'); // #20: same order as the standings
 roster.sort((a,b)=>rank[a.driverId]-rank[b.driverId]);
 const moves = F1Common.standingsMoves(currentSeasonRounds, L, 'drivers'); // issue #47
 let html;
 if(pickerSort==='rank'){
   html = roster.map((d,i)=>pickerRowHTML(d,i+1,moves)).join('');
 }else{
   const teamRank = F1Common.standingsRank(currentSeasonRounds, L, 'teams');
   const teamsOrdered=[...new Set(roster.map(d=>d.teamId))].sort((a,b)=>teamRank[a]-teamRank[b]);
   html = teamsOrdered.map(teamId=>{
     const teamDrivers = roster.filter(d=>d.teamId===teamId);
     return F1Common.pickerTeamLabelHTML(teamId, teamDrivers[0].teamName)
       + teamDrivers.map(d=>pickerRowHTML(d,null,moves)).join('');
   }).join('');
 }
 document.getElementById('driverPicker').innerHTML = html;
 document.querySelectorAll('#driverPicker input').forEach(cb=>{
   cb.addEventListener('change', ()=>{
     const id=cb.dataset.id;
     selectedDriverIds = cb.checked ? [...selectedDriverIds, id] : selectedDriverIds.filter(x=>x!==id);
     recompute(L);
   });
 });
 updatePresetActive();
}

// issue #13: highlight whichever preset button (if any) exactly matches the current selection, so
// it's clear what's picked — not highlighted at all if the selection was built by hand-checking boxes.
function updatePresetActive(){
 const cum = F1Data.cumulative(currentSeasonRounds, L);
 const ranked = F1Common.standingsOrder(currentSeasonRounds, L, 'drivers');
 const sets = { all: Object.keys(cum.drivers), none: [], 5: ranked.slice(0,5), 10: ranked.slice(0,10) };
 F1Common.markActivePreset(sets, selectedDriverIds);
}

document.getElementById('chartSortSelect').addEventListener('change', e=>{
 chartSort = e.target.value;
 draw(); // sort only changes row order within already-computed D — no need to recompute buckets
});
document.getElementById('chartOptRow').addEventListener('change', e=>{
 const cb=e.target.closest('input[data-opt]'); if(!cb) return;
 const opt=cb.dataset.opt;
 if(opt==='below10') showBelowP10=cb.checked;
 else if(opt==='sprint') includeSprints=cb.checked;
 recompute(L); // these all change what the buckets count — rebuild from already-loaded data, no network
});
document.getElementById('sortSeg').addEventListener('change', e=>{
 pickerSort = e.target.value;
 renderDriverPicker();
});
document.getElementById('presetRow').addEventListener('click', e=>{
 const btn=e.target.closest('button[data-preset]'); if(!btn) return;
 const cum = F1Data.cumulative(currentSeasonRounds, L);
 const ranked = F1Common.standingsOrder(currentSeasonRounds, L, 'drivers');
 const p = btn.dataset.preset;
 selectedDriverIds = p==='all' ? Object.keys(cum.drivers) : p==='none' ? [] : ranked.slice(0,+p);
 recompute(L);
});

// #33: PNG / CSV of the finishing-position chart
F1Export.attach(document.getElementById('ridgeCanvas').closest('.card'), {
 name:'finishing-positions',
 title:()=>'Race finishing positions',
 subtitle:()=>`${F1Export.roundText()} · ${includeSprints ? 'Grands Prix and sprints' : 'Grands Prix only'}`,
 canvas:()=>document.getElementById('ridgeCanvas'),
 csv:()=>{ if(!ridgeChart) return null; const ds=ridgeChart.data.datasets.filter(d=>!d._baseline);
   return [['Driver', ...ridgeChart.data.labels, 'Starts'], ...ds.map(d=>[d._code, ...d._counts, d._starts])]; },
});
// #87: PNG / CSV of the heat strip. The strip is HTML, so the picture is drawn for the export.
function drawHeatPicture(ctx, x, y, width, measure){
 const rows=heatRows, n=currentSeasonRounds.length; if(!rows.length || !n) return 0;
 const ffam=getComputedStyle(document.body).fontFamily, css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
 ctx.font='600 12px '+ffam;
 const flagW=F1Common.flagSpace(rows.map(r=>r.nat));
 const labelW=flagW+Math.max(...rows.map(r=>ctx.measureText(r.code).width))+8;
 const gap=2, step=Math.max(6, Math.min(24, Math.floor((width-labelW)/n))), cs=step-gap, headH=14, keyH=26;
 const H=headH+rows.length*step+keyH;
 if(measure) return H;
 ctx.save(); ctx.textBaseline='middle';
 ctx.font='400 10px '+ffam; ctx.textAlign='center'; ctx.fillStyle=css('--sub');
 currentSeasonRounds.forEach((r,i)=>{ ctx.globalAlpha=r.round>L?0.45:1; ctx.fillText(String(r.round), x+labelW+i*step+cs/2, y+headH/2-1); });
 ctx.globalAlpha=1;
 const box=(px,py,w,h)=>{ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(px,py,w,h,2.5); else ctx.rect(px,py,w,h); };
 const cell=(cx, cy, c, s)=>{ // the same marks as on the page, s px square
   if(c.later) return;
   if(c.gp==null){ ctx.fillStyle=css('--line-strong'); ctx.fillRect(cx+s*0.3, cy+s/2-0.75, s*0.4, 1.5); return; }
   if(c.gp==='NC'){
     box(cx,cy,s,s); ctx.fillStyle=css('--inset'); ctx.fill();
     ctx.strokeStyle=css('--elim'); ctx.lineWidth=Math.max(1.2, s*0.12); ctx.lineCap='round';
     const m=s*0.22; ctx.beginPath(); ctx.moveTo(cx+m,cy+m); ctx.lineTo(cx+s-m,cy+s-m); ctx.moveTo(cx+s-m,cy+m); ctx.lineTo(cx+m,cy+s-m); ctx.stroke();
     return;
   }
   box(cx,cy,s,s); ctx.fillStyle=heatColor(c.gp); ctx.fill();
   if(c.gp<=3){ ctx.fillStyle=css('--panel'); ctx.beginPath(); ctx.arc(cx+s/2, cy+s/2, s*0.14, 0, 2*Math.PI); ctx.fill(); }
 };
 rows.forEach((row,ri)=>{
   const cy=y+headH+ri*step;
   ctx.textAlign='left'; ctx.font='600 12px '+ffam; ctx.fillStyle=row.color;
   F1Common.drawFlag(ctx, row.nat, x, cy+cs/2);
   ctx.fillText(row.code, x+flagW, cy+cs/2);
   row.cells.forEach((c,i)=>cell(x+labelW+i*step, cy, c, cs));
 });
 // key: P1 … P20+, podium, NC, did not race
 let kx=x; const k=11, ky=y+headH+rows.length*step+10;
 ctx.font='400 11.5px '+ffam; ctx.textAlign='left';
 const label=t=>{ ctx.fillStyle=css('--sub'); ctx.fillText(t, kx, ky+k/2); kx+=ctx.measureText(t).width+5; };
 const swatch=c=>{ cell(kx, ky, c, k); kx+=k+2; };
 label('P1'); [1,2,3,5,8,11,14,17,20].forEach(p=>swatch({gp:p})); kx+=3; label(`P${HEAT_WORST}+`); kx+=10;
 swatch({gp:1}); label('podium'); kx+=10;
 swatch({gp:'NC'}); label('NC'); kx+=10;
 swatch({gp:null}); label('did not race');
 ctx.restore();
 return H;
}
F1Export.attach(document.getElementById('heatCard'), {
 name:'results-by-round',
 title:()=>'Results by round',
 subtitle:()=>`${F1Export.roundText()} · Grand Prix finishes${includeSprints?' (sprints in the CSV)':''}`,
 width:640,
 draw:drawHeatPicture,
 // a column per round through the slider's round: the position, NC, or blank when the driver didn't race;
 // with Sprints shown, a sprint column after each sprint round
 csv:()=>{ if(!heatRows.length) return null;
   const rounds=currentSeasonRounds.filter(r=>r.round<=L), sp=includeSprints;
   const head=['Driver']; rounds.forEach(r=>{ head.push('R'+r.round); if(sp && r.sprintResults) head.push('R'+r.round+' sprint'); });
   return [head, ...heatRows.map(row=>{ const out=[row.code];
     row.cells.forEach(c=>{ if(c.later) return; out.push(c.gp==null?'':c.gp); if(sp && c.sp!==undefined) out.push(c.sp==null?'':c.sp); });
     return out; })]; },
});
window.addEventListener('f1selection', e=>buildFromSelection(e.detail));
window.addEventListener('f1roundchange', e=>{ if(currentSeasonRounds.length) recompute(e.detail.round); });
window.addEventListener('themechange', draw);
let lastNarrow=F1Common.isNarrow();
window.addEventListener('resize', ()=>{ const now=F1Common.isNarrow(); if(now!==lastNarrow){ lastNarrow=now; draw(); } });
F1Controls.mount('f1controls');
</script>
