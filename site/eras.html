<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eras · F1 Data Explorer</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="nav.js"></script>
<script src="common.js"></script>
<script src="eras.js"></script>
<script src="export.js"></script>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 16px 40px;}
.wrap{max-width:820px;margin:0 auto;}
h1{font-size:18px;margin:0 0 4px;color:var(--ink);}
.sub{font-size:12.5px;color:var(--sub);margin:0 0 16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;}
.note{font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:10px;}
.erasStatus{font-size:12px;color:var(--sub);margin:0 0 14px;}
.erasStatus.err{color:var(--elim);}
.erasHead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;}
.erasFilter{font:inherit;font-size:12.5px;background:var(--inset);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0;width:150px;}
#erasPicker{max-height:280px;overflow-y:auto;}
.pickerEmpty{font-size:12.5px;color:var(--sub);padding:8px 2px;}
.erasChartWrap{position:relative;width:100%;height:380px;}
.erasLegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin:0 0 10px;}
.erasLegend span{display:inline-flex;align-items:center;gap:6px;}
.erasLegend i{display:inline-block;width:20px;height:0;border-top:3px solid var(--c);}
.erasLegend i.d1{border-top-style:dashed;} .erasLegend i.d2{border-top-style:dotted;}
.eraKey{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 16px;margin-top:12px;font-size:11.5px;color:var(--sub);line-height:1.4;}
.eraKey div{display:flex;gap:7px;align-items:baseline;}
.eraKey b{color:var(--ink2);font-weight:600;white-space:nowrap;}
.eraKey .eraChip{flex:none;width:10px;height:10px;border-radius:3px;background:var(--inset);border:1px solid var(--line-strong);align-self:center;}
.eraKey .eraChip.alt{background:var(--line);}
@media (max-width:600px){
  .erasChartWrap{height:340px;}
  .erasFilter{width:100%;order:9;}
}
</style>
</head>
<body>
<div class="wrap">
<div class="theme-bar"><nav id="siteNav" class="site-nav" aria-label="Site"></nav><div id="themeToggle"></div></div>
<h1>Eras</h1>
<p class="sub">Where drivers and teams finished in the championship, season by season since 1950, against the rule eras of the sport. Pick the names to compare. Positions only, since the points system changed several times.</p>
<div class="erasStatus" id="erasStatus">Loading the history…</div>

<div class="card">
<div class="erasHead">
 <span style="font-size:12px;color:var(--sub);">Show</span>
 <select id="viewSel" class="ddSelect" aria-label="Drivers or constructors">
  <option value="drivers">Drivers' Championship</option>
  <option value="teams">Constructors' Championship</option>
 </select>
 <span style="flex:1;"></span>
 <span class="pickerSort" style="font-size:12px;color:var(--sub);">Sort by</span>
 <select id="sortSel" class="ddSelect pickerSort" aria-label="Sort the list">
  <option value="titles">Titles</option>
  <option value="name">Name</option>
  <option value="first">First season</option>
 </select>
</div>
<div class="btnrow" id="presetRow" style="margin-bottom:10px;"></div>
<div class="erasHead" style="margin-bottom:6px;">
 <button type="button" class="pickerToggle" id="pickerToggle" aria-expanded="true" aria-controls="erasPicker" title="Show or hide the list"><span class="chev" aria-hidden="true">▾</span><span id="pickerLabel">Drivers shown</span></button><span id="pickerSummary" class="pickerSummary"></span>
 <span style="flex:1;"></span>
 <input type="search" id="erasFilter" class="erasFilter" placeholder="Find a name" aria-label="Find a name">
</div>
<div id="erasPicker"></div>
</div>

<div class="card" id="chartCard">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;margin:0 0 10px;">
 <span style="font-size:13px;font-weight:600;color:var(--ink);" id="chartTitle">Championship position by season</span>
 <span style="font-size:12px;color:var(--sub);" id="chartSub"></span>
</div>
<div class="erasLegend" id="erasLegend"></div>
<div class="erasChartWrap"><canvas id="erasCanvas" role="img" aria-label="Championship position of the picked drivers or teams in every season, with the rule eras shaded behind"></canvas></div>
<div id="erasEmpty" style="font-size:12.5px;color:var(--sub);display:none;margin-top:8px;">Nothing picked.</div>
<div class="note" id="erasNote"></div>
<div class="eraKey" id="eraKey"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ff = getComputedStyle(document.body).fontFamily;
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const MAX_POS = 20; // the chart never goes below P20; anything lower runs off the bottom
const HALF = 0.3; // half the width of a season's flat segment, in seasons
const DASHES = [[], [7, 4], [2, 3]]; // teammates in one colour: solid, dashed, dotted

let model = null, view = 'drivers', sortBy = 'titles', filter = '', chart = null;
const picked = { drivers: null, teams: null };   // arrays of ids; null = the default until the first change
let linked = null;

const list = () => view === 'drivers' ? model.drivers : model.teams;
const col = c => F1Theme.team(c);

// ---- presets ----
const sets = () => {
  const L = list(), top = n => L.filter(e => e.titles > 0).slice(0, n).map(e => e.id);
  const latest = model.years[model.years.length - 1];
  const now = L.filter(e => e.seasons[latest] && e.seasons[latest].pos <= (view === 'drivers' ? 10 : 5)).sort((a, b) => a.seasons[latest].pos - b.seasons[latest].pos).map(e => e.id);
  const s = { top5: top(5), top10: top(10), champs: L.filter(e => e.titles > 0).map(e => e.id), now, none: [] };
  return s;
};
const defaultIds = () => sets().top5;
const current = () => picked[view] || defaultIds();
const PRESETS = () => [['top5', 'Most titles (5)', 'The five with the most titles'], ['top10', 'Top 10', 'The ten with the most titles'],
  ['champs', 'All champions', 'Everyone who has won the title'],
  ['now', model && view === 'drivers' ? 'Top 10 now' : 'Top 5 now', 'The best of the latest season'], ['none', 'None', '']];

function renderPresets(){
  $('presetRow').innerHTML = PRESETS().map(([k, label, tip]) => `<button type="button" class="pill" data-preset="${k}" title="${esc(tip)}">${label}</button>`).join('');
  markPresets();
}
function markPresets(){
  const s = sets(), cur = new Set(current());
  document.querySelectorAll('#presetRow .pill').forEach(b => {
    const ids = s[b.dataset.preset] || [];
    b.classList.toggle('active', ids.length === cur.size && ids.every(i => cur.has(i)));
  });
}

// ---- picker ----
function sorted(){
  const L = [...list()];
  if(sortBy === 'name') L.sort((a, b) => a.short.localeCompare(b.short));
  else if(sortBy === 'first') L.sort((a, b) => a.first - b.first || b.titles - a.titles);
  const f = filter.trim().toLowerCase();
  return f ? L.filter(e => e.name.toLowerCase().includes(f)) : L;
}
function renderPicker(){
  const cur = new Set(current()), rows = sorted();
  $('pickerLabel').textContent = view === 'drivers' ? 'Drivers shown' : 'Teams shown';
  $('erasPicker').innerHTML = rows.map(e => {
    const on = cur.has(e.id), t = e.titles ? `${e.titles} ${e.titles === 1 ? 'title' : 'titles'}` : `best P${e.best}`;
    return `<label class="pickerRow"><input type="checkbox" data-id="${esc(e.id)}" ${on ? 'checked' : ''}>
      <span class="pickerDot" style="background:${col(e.color)}"></span>
      <span class="pickerCode${on ? '' : ' off'}">${esc(e.name)}<span class="pickerCodeTag">${e.span}</span></span>
      <span class="pickerPts">${t}</span></label>`;
  }).join('') || '<div class="pickerEmpty">No match.</div>';
  F1Common.updatePickerSummary(current(), list().length, view === 'drivers' ? 'drivers' : 'teams');
  markPresets();
}

// ---- URL (view, d, t) ----
function syncURL(){
  const p = new URLSearchParams();
  if(view !== 'drivers') p.set('view', view);
  ['drivers', 'teams'].forEach(v => {
    if(!picked[v]) return;
    p.set(v === 'drivers' ? 'd' : 't', picked[v].join(','));
  });
  const q = p.toString().replace(/%2C/g, ',');
  try{ history.replaceState(history.state, '', location.pathname + (q ? '?' + q : '')); }catch(e){}
}

// ---- chart ----
const bandPlugin = {
  id: 'eraBands',
  beforeDatasetsDraw(ch){
    const { ctx, chartArea: a, scales: { x } } = ch, P = F1Theme.chart();
    ctx.save();
    ctx.beginPath(); ctx.rect(a.left, 0, a.width, a.bottom); ctx.clip();
    F1Eras.ERAS.forEach((era, i) => {
      const from = Math.max(era.from, x.min + 0.5), to = Math.min(era.to, x.max - 0.5);
      if(from > to) return; // the era is outside the seasons on show
      const l = x.getPixelForValue(from - 0.5), r = x.getPixelForValue(to + 0.5);
      if(i % 2 === 0){ ctx.fillStyle = P.projShade; ctx.fillRect(l, a.top, r - l, a.height); }
      ctx.strokeStyle = P.grid; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(l, a.top); ctx.lineTo(l, a.bottom); ctx.stroke();
      // the era's label above the plot: sideways when the band is too narrow for its text
      ctx.fillStyle = P.text; ctx.font = `600 10px ${ff}`; ctx.textBaseline = 'middle';
      const bw = r - l, fits = t => ctx.measureText(t).width + 6 <= bw;
      const text = fits(era.label) ? era.label : era.short;
      if(fits(text)){ ctx.textAlign = 'center'; ctx.fillText(text, (l + r) / 2, a.top - 14); }
      else { ctx.save(); ctx.translate((l + r) / 2, a.top - 6); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'left'; ctx.fillText(text, 0, 0); ctx.restore(); }
    });
    ctx.restore();
  }
};

function datasets(){
  const ids = current(), L = list(), byId = new Map(L.map(e => [e.id, e])), seen = {};
  return ids.map(id => byId.get(id)).filter(Boolean).sort((a, b) => L.indexOf(a) - L.indexOf(b)).map(e => {
    const n = (seen[e.color] = (seen[e.color] || 0) + 1) - 1;
    // O1: each season is a flat segment at its position (two points, a little either side of the year);
    // consecutive seasons are joined by an angled line, as on the position charts. A missing season breaks the line.
    const at = f => model.years.flatMap(y => { const k = e.seasons[y]; return [f(k, y - HALF), f(k, y + HALF)]; });
    return { e, label: e.name, dash: DASHES[Math.min(n, 2)], color: col(e.color),
      colors: at(k => k ? col(k.color) : null), data: at((k, x) => ({ x, y: k ? k.pos : null })) };
  });
}

// #135 (O5): the axes fit the picks: seasons from one before the first to one after the last, positions down to the
// worst one shown (to a multiple of 5, at least P5, never below P20). Nothing picked: the whole span.
function axes(ds){
  const ys = model.years, first = ys[0], last = ys[ys.length - 1];
  let lo = Infinity, hi = -1, worst = 0;
  ds.forEach(d => Object.entries(d.e.seasons).forEach(([y, k]) => { lo = Math.min(lo, +y); hi = Math.max(hi, +y); worst = Math.max(worst, k.pos); }));
  if(hi < 0) return { x0: first, x1: last, yMax: MAX_POS };
  return { x0: Math.max(first, lo - 1), x1: Math.min(last, hi + 1), yMax: Math.min(MAX_POS, Math.max(5, Math.ceil(worst / 5) * 5)) };
}
const yTicks = yMax => yMax <= 5 ? [1, 2, 3, 4, 5] : [1, ...Array.from({ length: yMax / 5 }, (_, i) => (i + 1) * 5)];

function draw(){
  if(!model) return;
  const P = F1Theme.chart(), nar = F1Common.isNarrow(), ds = datasets();
  if(chart){ chart.destroy(); chart = null; }
  $('erasEmpty').style.display = ds.length ? 'none' : 'block';
  $('erasLegend').innerHTML = ds.map(d => `<span style="--c:${d.color}"><i class="${d.dash.length === 0 ? '' : d.dash[0] > 3 ? 'd1' : 'd2'}"></i>${esc(d.label)}</span>`).join('');
  const ax = axes(ds), n = ax.x1 - ax.x0 + 1, stride = n <= 12 ? 1 : n <= 20 ? (nar ? 2 : 1) : n <= 45 ? 5 : nar ? 10 : 5;
  $('chartSub').textContent = `${view === 'drivers' ? 'drivers' : 'constructors'} · ${ax.x0}–${ax.x1}`;
  $('erasNote').textContent = (view === 'teams' ? `Constructors' standings start in ${model.firstTeamYear}. ` : '')
    + `Positions below P${MAX_POS} run off the bottom.`
    + (model.partial ? ` ${model.partial} is the standings after round ${model.round}, so no title yet.` : '')
    + (view === 'teams' ? ' A team keeps its line through renames and new owners (Tyrrell, BAR, Honda, Brawn and Mercedes are one line); the line takes the colour the team had each season.' : ' The line takes the colour of the team the driver raced for that season.');
  Chart.defaults.font.family = ff; Chart.defaults.color = P.text;
  chart = new Chart($('erasCanvas'), {
    type: 'line',
    plugins: [bandPlugin, F1Common.hoverLine],
    data: { datasets: ds.map(d => ({
      label: d.label, data: d.data, borderColor: d.color, borderWidth: 2.4, borderDash: d.dash, spanGaps: false, tension: 0,
      pointBackgroundColor: d.colors, pointBorderColor: d.colors, pointRadius: 0, pointHoverRadius: 0,
      segment: { borderColor: c => d.colors[c.p1DataIndex] || d.color },
      _e: d.e })) },
    options: {
      animation: false, responsive: true, maintainAspectRatio: false, parsing: false,
      layout: { padding: { top: nar ? 40 : 32, right: 6 } },
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { type: 'linear', min: ax.x0 - 0.5, max: ax.x1 + 0.5, grid: { display: false }, border: { color: P.axis },
          afterBuildTicks(sc){ sc.ticks = []; for(let y = ax.x0; y <= ax.x1; y++) if(stride === 1 || y % stride === 0) sc.ticks.push({ value: y }); },
          ticks: { autoSkip: false, maxRotation: 0, color: P.text, callback: v => v } },
        y: { reverse: true, min: 0.5, max: ax.yMax + 0.5, grid: { color: P.grid }, border: { color: P.axis },
          afterBuildTicks(s){ s.ticks = yTicks(ax.yMax).map(value => ({ value })); },
          ticks: { color: P.text, callback: v => 'P' + v }, title: { display: !nar, text: 'Championship position', color: P.text } }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          filter: it => it.raw.y != null, itemSort: (a, b) => a.raw.y - b.raw.y,
          callbacks: {
            title(items){ const y = Math.round(items[0].raw.x), era = F1Eras.eraOf(y); return `${y}${era ? ' · ' + era.name : ''}${y === model.partial ? ` (after round ${model.round})` : ''}`; },
            label(it){ const s = it.dataset._e.seasons[Math.round(it.raw.x)]; return `${it.dataset.label}: P${s.pos} · ${Math.round(s.pts * 10) / 10} pts${s.name ? ' · ' + s.name : ''}`; },
            labelColor: it => ({ borderColor: it.dataset.borderColor, backgroundColor: it.dataset.pointBackgroundColor[it.dataIndex] || it.dataset.borderColor })
          }
        }
      }
    }
  });
}

function renderEraKey(){
  $('eraKey').innerHTML = F1Eras.ERAS.map((e, i) => `<div><span class="eraChip${i % 2 ? ' alt' : ''}"></span><span><b>${e.from}–${e.to === 9999 ? 'now' : e.to} ${esc(e.name)}.</b> ${esc(e.note)}</span></div>`).join('');
}

function render(){ renderPresets(); renderPicker(); draw(); syncURL(); }

// ---- export ----
function exportRows(){
  const ds = datasets(); if(!ds.length) return null;
  const rows = [['Season', 'Era', ...ds.flatMap(d => [`${d.label} position`, `${d.label} points`, `${d.label} team`])]];
  model.years.forEach(y => { const era = F1Eras.eraOf(y);
    rows.push([y, era ? era.name : '', ...ds.flatMap(d => { const s = d.e.seasons[y]; return s ? [s.pos, s.pts, s.name] : ['', '', '']; })]); });
  return rows;
}
F1Export.attach($('chartCard'), {
  get name(){ return 'eras-' + view; },
  title: () => view === 'drivers' ? "Drivers' Championship by era" : "Constructors' Championship by era",
  subtitle: () => `Championship position by season, ${model.years[0]}–${model.years[model.years.length - 1]}`,
  canvas: () => $('erasCanvas'),
  legend: () => datasets().map(d => ({ label: d.label, color: d.color, dash: d.dash })),
  csv: exportRows
});

// ---- events ----
const isDefault = ids => ids.length === defaultIds().length && ids.every((x, i) => x === defaultIds()[i]);
function setPicked(ids){ picked[view] = isDefault(ids) ? null : ids; render(); } // the default needs no link key
$('presetRow').addEventListener('click', e => { const b = e.target.closest('.pill'); if(b) setPicked([...sets()[b.dataset.preset]]); });
$('erasPicker').addEventListener('change', e => {
  const id = e.target.dataset.id; if(!id) return;
  const cur = new Set(current()); e.target.checked ? cur.add(id) : cur.delete(id);
  const order = new Map(list().map((x, i) => [x.id, i]));
  picked[view] = [...cur].sort((a, b) => order.get(a) - order.get(b));
  if(isDefault(picked[view])) picked[view] = null;
  renderPicker(); draw(); syncURL();
});
$('viewSel').addEventListener('change', e => { view = e.target.value; filter = ''; $('erasFilter').value = ''; render(); });
$('sortSel').addEventListener('change', e => { sortBy = e.target.value; renderPicker(); });
$('erasFilter').addEventListener('input', e => { filter = e.target.value; renderPicker(); });
window.addEventListener('themechange', () => { renderPicker(); draw(); });
F1Common.initPickerToggle();
renderEraKey();

// ---- load ----
function applyLink(){
  const q = new URLSearchParams(location.search);
  if(q.get('view') === 'teams') view = 'teams';
  $('viewSel').value = view;
  [['drivers', 'd'], ['teams', 't']].forEach(([v, k]) => {
    if(q.get(k) == null) return;
    const valid = new Set((v === 'drivers' ? model.drivers : model.teams).map(e => e.id));
    picked[v] = q.get(k).split(',').filter(id => valid.has(id));
  });
}
async function load(){
  const st = $('erasStatus'); st.className = 'erasStatus'; st.textContent = 'Loading the history…';
  try{
    const res = await fetch('data/eras.json');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!data || data.v !== 1 || !data.seasons) throw new Error('unexpected file');
    model = F1Eras.build(data);
  }catch(e){
    st.className = 'erasStatus err';
    st.innerHTML = 'Couldn’t load the history. <button type="button" class="f1c-link" id="erasRetry">Retry</button>';
    $('erasRetry').addEventListener('click', load);
    return;
  }
  const n = model.years.length, when = model.generatedAt ? new Date(model.generatedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';
  st.textContent = `${n} seasons · ${model.years[0]}–${model.years[n - 1]}${model.partial ? ` (${model.partial} so far)` : ''}${when ? ` · updated ${when}` : ''}`;
  applyLink();
  render();
}
load();
</script>
</body>
</html>
