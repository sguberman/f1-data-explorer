<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 F1 Drivers — Race Finishing Position</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 16px 40px;}
.wrap{max-width:820px;margin:0 auto;}
h1{font-size:18px;margin:0 0 4px;color:var(--ink);}
.sub{font-size:12.5px;color:var(--sub);margin:0 0 16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.panel h3{font-size:12px;font-weight:600;margin:0 0 2px;}
</style>
</head>
<body>
<div class="wrap">
<div class="theme-bar" id="themeToggle"></div>
<h1>2026 F1 Drivers — Race Finishing Position</h1>
<p class="sub">Top four teams · all 15 rounds · mechanical DNFs excluded · Grand Prix classification only (sprint sessions not included)</p>
<div class="card">
<div id="grid" class="grid"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ff=getComputedStyle(document.body).fontFamily;
const T={mer:'#00A79D',mcl:'#FF8000',fer:'#DC0000',rb:'#1B2A6B'};
const LAB=['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','11+/DNF'];
const D=[
{n:'ANT',c:T.mer,v:[8,2,2,0,1,0,0,0,0,0,0]},
{n:'RUS',c:T.mer,v:[3,4,1,2,1,0,1,0,0,0,2]},
{n:'NOR',c:T.mcl,v:[2,1,2,2,2,0,2,0,0,0,1]},
{n:'PIA',c:T.mcl,v:[0,1,1,2,4,0,0,1,1,0,4]},
{n:'HAM',c:T.fer,v:[1,2,2,2,3,4,0,0,0,0,0]},
{n:'LEC',c:T.fer,v:[1,1,2,6,0,0,0,2,0,0,2]},
{n:'VER',c:T.rb,v:[0,4,3,1,1,1,0,1,0,0,2]},
{n:'HAD',c:T.rb,v:[0,0,2,0,1,5,0,1,0,0,3]}
];
const grid=document.getElementById('grid');
grid.innerHTML=D.map((d,i)=>`<div class="panel"><h3 id="lbl${i}"></h3><div style="position:relative;height:130px;"><canvas id="qc${i}"></canvas></div></div>`).join('');
let charts=[];
function draw(){
  const P=F1Theme.chart();
  Chart.defaults.font.family=ff;Chart.defaults.font.size=9.5;Chart.defaults.color=P.text;
  charts.forEach(c=>c.destroy());charts=[];
  D.forEach((d,i)=>{
    const c=F1Theme.team(d.c);
    document.getElementById('lbl'+i).style.color=c;
    document.getElementById('lbl'+i).textContent=d.n;
    charts.push(new Chart(document.getElementById('qc'+i),{type:'bar',data:{labels:LAB,datasets:[{data:d.v,backgroundColor:c,borderRadius:2,maxBarThickness:18}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:t=>t.raw+' round(s)'}}},
    scales:{x:{grid:{display:false},ticks:{color:P.text,font:{size:8.5}}},y:{beginAtZero:true,max:8,ticks:{color:P.text,stepSize:1,precision:0},grid:{color:P.grid}}}}}));
  });
}
draw();
window.addEventListener('themechange',draw);
</script>
</body>
</html>
