<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 F1 Drivers — Race Finishing Position</title>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<script src="data.js"></script>
<script src="controls.js"></script>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;padding:24px 16px 40px;}
.wrap{max-width:820px;margin:0 auto;}
h1{font-size:18px;margin:0 0 4px;color:var(--ink);}
.sub{font-size:12.5px;color:var(--sub);margin:0 0 16px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;}
.note{font-size:11.5px;color:var(--sub);line-height:1.5;margin-top:10px;}
.ridgeWrap{position:relative;width:100%;}
#driverPicker{max-height:280px;overflow-y:auto;}
.pickerTeamLabel{font-size:11px;color:var(--sub);padding:10px 2px 4px;}
.pickerTeamLabel:first-child{padding-top:2px;}
.pickerRow{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:0.5px solid var(--line);cursor:pointer;}
.pickerRow:last-child{border-bottom:none;}
.pickerRow input{margin:0;flex:0 0 auto;}
.pickerRank{font-size:11px;color:var(--sub);width:16px;text-align:right;flex:0 0 auto;}
.pickerDot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
.pickerCode{font-size:13px;font-weight:500;flex:1;}
.pickerCode.off{color:var(--sub);font-weight:400;}
.pickerCodeTag{font-size:10px;color:var(--sub);font-weight:400;margin-left:6px;}
.pickerPts{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:0 0 auto;}
</style>
</head>
<body>
<div class="wrap">
<div class="theme-bar" id="themeToggle"></div>
<h1>2026 F1 Drivers — Race Finishing Position</h1>
<p class="sub" id="pageSub">Defaults to the top 8 drivers as of the selected round — sort, use a preset, or pick anyone below</p>
<div id="f1controls" class="f1c"></div>
<div class="card" style="margin-bottom:16px;">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;">
 <span style="font-size:12px;color:var(--sub);">Sort</span>
 <div class="btnrow" id="chartSortRow">
  <button type="button" class="pill active" data-sort="median">Median</button>
  <button type="button" class="pill" data-sort="champ">Championship</button>
  <button type="button" class="pill" data-sort="team">Team</button>
 </div>
 <span style="flex:1;"></span>
 <div class="btnrow" id="chartOptRow">
  <button type="button" class="pill" data-opt="below10">Below P10</button>
  <button type="button" class="pill" data-opt="mech">Mechanical DNFs</button>
  <button type="button" class="pill active" data-opt="sprint">Sprints</button>
 </div>
</div>
<div class="ridgeWrap" id="ridgeWrap"><canvas id="ridgeCanvas"></canvas></div>
<div id="empty" style="font-size:12.5px;color:var(--sub);display:none;">No drivers selected.</div>
<div class="note" id="ridgeNote"></div>
</div>
<div class="card">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px;">
 <span style="font-size:12px;color:var(--sub);">Drivers shown</span>
 <span style="flex:1;"></span>
 <div class="btnrow" id="sortSeg">
  <button type="button" class="pill active" data-sort="team">By team</button>
  <button type="button" class="pill" data-sort="rank">By ranking</button>
 </div>
</div>
<div class="btnrow" id="presetRow" style="margin-bottom:10px;">
 <button type="button" class="pill" data-preset="all">All</button>
 <button type="button" class="pill" data-preset="none">None</button>
 <button type="button" class="pill" data-preset="2">Top 2</button>
 <button type="button" class="pill" data-preset="5">Top 5</button>
 <button type="button" class="pill" data-preset="8">Top 8</button>
 <button type="button" class="pill" data-preset="10">Top 10</button>
</div>
<div id="driverPicker"></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ff=getComputedStyle(document.body).fontFamily;

// Team colors by f1api.dev teamId. Unlisted teams get a stable hashed color instead of breaking.
const TEAM_COLORS={mercedes:'#00A79D',ferrari:'#DC0000',mclaren:'#FF8000',red_bull:'#1B2A6B',redbull:'#1B2A6B',
 alpine:'#FF1493',haas:'#1A1A1A',williams:'#00A3E0',audi:'#E8534D',sauber:'#E8534D',
 aston_martin:'#229971',astonmartin:'#229971',rb:'#2B4EE6',racing_bulls:'#2B4EE6',visa_rb:'#2B4EE6',cadillac:'#B8860B'};
function teamColor(teamId){
 if(TEAM_COLORS[teamId]) return TEAM_COLORS[teamId];
 let h=0; for(const ch of teamId) h=(h*31+ch.charCodeAt(0))>>>0;
 return `hsl(${h%360} 55% 45%)`;
}
const SHORT_TEAM_NAMES={mercedes:'Mercedes',ferrari:'Ferrari',mclaren:'McLaren',red_bull:'Red Bull',redbull:'Red Bull',
 alpine:'Alpine',haas:'Haas',williams:'Williams',audi:'Audi',sauber:'Audi',
 aston_martin:'Aston Martin',astonmartin:'Aston Martin',rb:'Racing Bulls',racing_bulls:'Racing Bulls',visa_rb:'Racing Bulls',cadillac:'Cadillac'};
function shortTeamName(teamId, fallback){ return SHORT_TEAM_NAMES[teamId] || fallback || teamId; }

let LAB=['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','11+/DNF'];

let D=[], L=0, P;
// issue #35: chart display options — all computed purely from already-loaded season data, no network.
// chartSort: 'median' (default, best typical finish on top), 'champ' (current drivers' standings order),
// 'team' (teams grouped by constructors' standings order, drivers within a team by standings order).
// showBelowP10: false (default) folds everything below P10 into one "11+/DNF" bucket, same as before;
// true expands individual positions down to the worst classified finish seen, plus a separate DNF bucket.
// includeMechanical: false (default, matches the site's usual convention) excludes mechanical DNFs
// entirely (not even counted as a start); true counts them as a start, bucketed as a DNF/no-position.
// includeSprints: true (default, new as of #35) folds sprint-session results into the same histogram as
// Grand Prix results; false restricts the chart to Grand Prix classification only, as it was before.
let chartSort='median', showBelowP10=false, includeMechanical=false, includeSprints=true;

// issue #33: single ridgeline (joyplot) chart for the selected drivers — same mechanism as the
// simulator's ridgeline plots (#32): each driver gets a baseline row (invisible flat dataset) and a
// stepped curve dataset filled down to it with fill:'-1', offset vertically so rows stack, normalized
// to each driver's OWN peak bucket (a shape comparison, not an absolute-count one).
const RIDGE_ROW=1, RIDGE_PEAK=0.82, RIDGE_ROW_PX=58, RIDGE_PAD_PX=34, RIDGE_FILL_ALPHA=0.35;
let ridgeChart=null;
// teamColor() returns either a hex string or an `hsl(H S% L%)` hashed-fallback string — appending a
// hex alpha suffix only works on the first form; on the second it's invalid CSS that canvas silently
// renders as opaque black instead of the driver's color. This handles both.
function withAlpha(color, alpha){
 if(color[0]==='#'){
   const a=Math.round(alpha*255).toString(16).padStart(2,'0');
   return color+a;
 }
 const m=color.match(/^hsl\(\s*([\d.]+)\s+([\d.]+%)\s+([\d.]+%)\s*\)$/);
 if(m) return `hsla(${m[1]}, ${m[2]}, ${m[3]}, ${alpha})`;
 return color;
}
function medianBucket(counts){
 const total=counts.reduce((a,b)=>a+b,0);
 if(!total) return counts.length-1;
 let cum=0;
 for(let i=0;i<counts.length;i++){ cum+=counts[i]; if(cum>=total/2) return i; }
 return counts.length-1;
}
let currentYear=null, currentSeasonRounds=[], selectedDriverIds=null, pickerSort='team';

async function buildFromSelection(detail){
 currentYear = detail.year;
 currentSeasonRounds = detail.seasonRounds;
 if(!currentSeasonRounds.length){ D=[]; draw(); renderDriverPicker(); return; }
 selectedDriverIds = null; // reset default whenever the season changes; round changes never touch this
 L = detail.round;
 const cum = F1Data.cumulative(currentSeasonRounds, L, 'include');
 selectedDriverIds = rankedDriverIds(cum).slice(0,8); // top 8 — roughly "top four teams" from the old static page
 recompute(detail.round);
}

function rankedDriverIds(cum){
 return Object.values(cum.drivers)
   .map(d=>({driverId:d.driverId,total:d.rounds.reduce((s,x)=>s+x.points,0)}))
   .sort((a,b)=>b.total-a.total).map(d=>d.driverId);
}

// Sessions (race, plus sprint if included) contributing to the histogram for a round, respecting the
// current includeSprints toggle.
function sessionRowsFor(r){
 return includeSprints && r.sprintResults ? [...(r.raceResults||[]), ...r.sprintResults] : (r.raceResults||[]);
}

// Worst classified position seen across all loaded rounds (through L), respecting the current
// mechanical/sprint toggles — used to size the expanded "show positions below P10" bucket range.
function maxClassifiedPosition(){
 let max = 10;
 currentSeasonRounds.forEach(r=>{
   if(r.round > L) return;
   sessionRowsFor(r).forEach(res=>{
     if(res.mechanical && !includeMechanical) return;
     if(res.position!=null && res.position>max) max = res.position;
   });
 });
 return max;
}

function buildLabels(){
 if(!showBelowP10) return ['P1','P2','P3','P4','P5','P6','P7','P8','P9','P10','11+/DNF'];
 const max = maxClassifiedPosition();
 const labs = []; for(let p=1; p<=max; p++) labs.push('P'+p);
 labs.push('DNF');
 return labs;
}

// Finishing-position histogram for one driver through round L, honoring the current mechanical/sprint/
// below-P10 toggles — pure in-memory aggregation over already-loaded data, safe on every drag/slider step.
function bucketsFor(driverId, labels){
 const n = labels.length, dnfIdx = n-1;
 const v = Array(n).fill(0);
 let starts = 0;
 currentSeasonRounds.forEach(r=>{
   if(r.round > L) return;
   sessionRowsFor(r).forEach(res=>{
     if(res.driverId !== driverId) return;
     if(res.mechanical && !includeMechanical) return; // excluded entirely, not even counted as a start
     starts++;
     const pos = res.position;
     const idx = (pos!=null && pos>=1 && pos<=dnfIdx) ? pos-1 : dnfIdx;
     v[idx]++;
   });
 });
 return { v, starts };
}

// Pure recompute from already-loaded season data — no network, safe to call on every slider step or
// option toggle.
function recompute(round){
 L = round;
 const cum = F1Data.cumulative(currentSeasonRounds, L, 'include');
 const driverRanked = rankedDriverIds(cum);
 const driverRank = {}; driverRanked.forEach((id,i)=>{ driverRank[id]=i; });
 const teamRanked = Object.values(cum.teams)
   .map(t=>({teamId:t.teamId,total:t.rounds.reduce((s,x)=>s+x.points,0)}))
   .sort((a,b)=>b.total-a.total).map(t=>t.teamId);
 const teamRank = {}; teamRanked.forEach((id,i)=>{ teamRank[id]=i; });
 LAB = buildLabels();
 D = (selectedDriverIds||[]).map(id=>{
   const dr = cum.drivers[id]; if(!dr) return null;
   const {v,starts} = bucketsFor(id, LAB);
   return { n:dr.code, teamId:dr.teamId, teamName:dr.teamName, c:teamColor(dr.teamId), v, starts,
     driverRank:driverRank[id]??999, teamRank:teamRank[dr.teamId]??999 };
 }).filter(Boolean);
 draw();
 renderDriverPicker();
}

function draw(){
 const wrap=document.getElementById('ridgeWrap'), empty=document.getElementById('empty'), note=document.getElementById('ridgeNote');
 if(ridgeChart){ ridgeChart.destroy(); ridgeChart=null; }
 if(!D.length){ wrap.style.display='none'; empty.style.display='block'; note.textContent=''; updateSub(); return; }
 wrap.style.display='block'; empty.style.display='none';
 P=F1Theme.chart();
 Chart.defaults.font.family=ff; Chart.defaults.color=P.text;
 const order=D.map(d=>({code:d.n, color:F1Theme.team(d.c), counts:d.v, starts:d.starts,
     driverRank:d.driverRank, teamRank:d.teamRank}))
   .sort((a,b)=>{
     if(chartSort==='champ') return a.driverRank-b.driverRank;
     if(chartSort==='team') return (a.teamRank-b.teamRank) || (a.driverRank-b.driverRank);
     return medianBucket(a.counts)-medianBucket(b.counts); // 'median' (default)
   });
 const n=order.length;
 wrap.style.height=(n*RIDGE_ROW_PX+RIDGE_PAD_PX)+'px';
 const datasets=[];
 order.forEach(({code,color,counts,starts},i)=>{
   const baseline=(n-1-i)*RIDGE_ROW;
   const peak=Math.max(...counts,1e-9);
   const heights=counts.map(v=>baseline+(v/peak)*RIDGE_PEAK);
   datasets.push({ data:LAB.map(()=>baseline), borderWidth:0, pointRadius:0, fill:false, _baseline:true });
   datasets.push({ data:heights, borderColor:color, backgroundColor:withAlpha(color,RIDGE_FILL_ALPHA), borderWidth:1.6, pointRadius:0,
     fill:'-1', stepped:'middle', _code:code, _counts:counts, _starts:starts });
 });
 ridgeChart=new Chart(document.getElementById('ridgeCanvas'),{
   type:'line',
   data:{labels:LAB, datasets},
   options:{
     responsive:true, maintainAspectRatio:false, animation:false,
     interaction:{mode:'index', intersect:false},
     plugins:{
       legend:{display:false},
       tooltip:{
         filter:item=>!item.dataset._baseline,
         callbacks:{
           title:t=>t[0].label,
           label:ctx=>{
             const cnt=ctx.dataset._counts[ctx.dataIndex], starts=ctx.dataset._starts;
             const pct=starts?100*cnt/starts:0;
             return ` ${ctx.dataset._code}: ${cnt} start${cnt===1?'':'s'} (${pct.toFixed(0)}%)`;
           }
         }
       }
     },
     scales:{
       x:{grid:{color:P.grid}, ticks:{color:P.text, maxRotation:0, autoSkip:LAB.length>12}},
       y:{
         min:-0.15, max:(n-1)*RIDGE_ROW+RIDGE_PEAK+0.25,
         grid:{display:false},
         afterBuildTicks:axis=>{ axis.ticks=Array.from({length:n},(_,i)=>({value:i})); },
         ticks:{
           color:ctx=>{ const i=n-1-Math.round(ctx.tick.value); return (order[i]&&order[i].color)||P.text; },
           callback:value=>{ const i=n-1-Math.round(value); return (order[i]&&order[i].code)||''; },
           font:{weight:'600'}
         }
       }
     }
   }
 });
 note.textContent = 'Starts counted — ' + order.map(o=>`${o.code}: ${o.starts}`).join(' · ');
 updateSub();
}

function updateSub(){
 const r=currentSeasonRounds.find(x=>x.round===L);
 const bits = [
   `${D.length} driver${D.length===1?'':'s'} selected`,
   `through Round ${L}${r?(' — '+r.raceName):''}`,
   includeSprints ? 'Grand Prix + sprint sessions' : 'Grand Prix classification only',
   includeMechanical ? 'mechanical DNFs included' : 'mechanical DNFs excluded',
   showBelowP10 ? 'full finishing order shown' : 'below P10 folded into one bucket'
 ];
 document.getElementById('pageSub').textContent = bits.join(' · ');
}

function pickerRowHTML(d, rank){
 const checked = selectedDriverIds.includes(d.driverId);
 return `<label class="pickerRow">
   <input type="checkbox" data-id="${d.driverId}" ${checked?'checked':''}>
   ${rank!=null?`<span class="pickerRank">${rank}</span>`:''}
   <span class="pickerDot" style="background:${F1Theme.team(teamColor(d.teamId))}"></span>
   <span class="pickerCode${checked?'':' off'}">${d.name}<span class="pickerCodeTag">${d.code}</span></span>
   <span class="pickerPts">${Math.round(d.total)}</span>
 </label>`;
}

function renderDriverPicker(){
 if(!currentSeasonRounds.length) return;
 const cum = F1Data.cumulative(currentSeasonRounds, L, 'include');
 let roster = Object.values(cum.drivers).map(d=>({...d,total:d.rounds.reduce((s,x)=>s+x.points,0)}));
 roster.sort((a,b)=>b.total-a.total);
 let html;
 if(pickerSort==='rank'){
   html = roster.map((d,i)=>pickerRowHTML(d,i+1)).join('');
 }else{
   const teamTotal={};
   roster.forEach(d=>{ teamTotal[d.teamId]=(teamTotal[d.teamId]||0)+d.total; });
   const teamsOrdered=[...new Set(roster.map(d=>d.teamId))].sort((a,b)=>teamTotal[b]-teamTotal[a]);
   html = teamsOrdered.map(teamId=>{
     const teamDrivers = roster.filter(d=>d.teamId===teamId);
     return `<div class="pickerTeamLabel">${teamDrivers[0].teamName||teamId}</div>`
       + teamDrivers.map(d=>pickerRowHTML(d,null)).join('');
   }).join('');
 }
 document.getElementById('driverPicker').innerHTML = html;
 document.querySelectorAll('#driverPicker input').forEach(cb=>{
   cb.addEventListener('change', ()=>{
     const id=cb.dataset.id;
     selectedDriverIds = cb.checked ? [...selectedDriverIds, id] : selectedDriverIds.filter(x=>x!==id);
     recompute(L);
   });
 });
}

document.getElementById('chartSortRow').addEventListener('click', e=>{
 const btn=e.target.closest('button[data-sort]'); if(!btn) return;
 chartSort = btn.dataset.sort;
 document.querySelectorAll('#chartSortRow button').forEach(b=>b.classList.toggle('active', b===btn));
 draw(); // sort only changes row order within already-computed D — no need to recompute buckets
});
document.getElementById('chartOptRow').addEventListener('click', e=>{
 const btn=e.target.closest('button[data-opt]'); if(!btn) return;
 const opt=btn.dataset.opt;
 if(opt==='below10') showBelowP10=!showBelowP10;
 else if(opt==='mech') includeMechanical=!includeMechanical;
 else if(opt==='sprint') includeSprints=!includeSprints;
 btn.classList.toggle('active');
 recompute(L); // these all change what the buckets count — rebuild from already-loaded data, no network
});
document.getElementById('sortSeg').addEventListener('click', e=>{
 const btn=e.target.closest('button[data-sort]'); if(!btn) return;
 pickerSort = btn.dataset.sort;
 document.querySelectorAll('#sortSeg button').forEach(b=>b.classList.toggle('active', b===btn));
 renderDriverPicker();
});
document.getElementById('presetRow').addEventListener('click', e=>{
 const btn=e.target.closest('button[data-preset]'); if(!btn) return;
 const cum = F1Data.cumulative(currentSeasonRounds, L, 'include');
 const ranked = rankedDriverIds(cum);
 const p = btn.dataset.preset;
 selectedDriverIds = p==='all' ? Object.keys(cum.drivers) : p==='none' ? [] : ranked.slice(0,+p);
 recompute(L);
});

window.addEventListener('f1selection', e=>buildFromSelection(e.detail));
window.addEventListener('f1roundchange', e=>{ if(currentSeasonRounds.length) recompute(e.detail.round); });
window.addEventListener('themechange', draw);
F1Controls.mount('f1controls', {defaultYear:2026});
</script>
</body>
</html>
